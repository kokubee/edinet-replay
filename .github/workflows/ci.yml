name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hashed CI lock
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      # No EDINET data is stored in the repo or on the runner, so the
      # integration and golden-regression tests skip here by design. CI covers
      # the unit, schema, semantic, canonicalization, and fixture tests.
      - run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hashed CI lock
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Audit workflows
        run: zizmor --format plain .github/workflows
      - name: Audit dependencies
        run: pip-audit -r requirements-ci.lock
